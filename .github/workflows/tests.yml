name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    env:
      # 目录名含中文：让 Python 在 Windows 控制台统一用 UTF-8 输出
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install collector dependencies
        run: python -m pip install --progress-bar off -r Github学习/collector/requirements.txt
      - name: Daily app tests
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath app-tests.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            # 把失败的用例和断言信息写成注解，不登录也能在运行页上看到
            Select-String -Path app-tests.log -Pattern '^(FAIL|ERROR): ', 'Error: ' |
              Select-Object -First 10 | ForEach-Object { Write-Output "::error title=app tests::$($_.Line)" }
            exit $code
          }
      - name: Collector tests
        working-directory: Github学习/collector
        run: |
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath collector-tests.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path collector-tests.log -Pattern '^(FAIL|ERROR): ', 'Error: ' |
              Select-Object -First 10 | ForEach-Object { Write-Output "::error title=collector tests::$($_.Line)" }
            exit $code
          }

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: Github学习/工具源码/题库更新/go.mod
          cache: false   # 无第三方依赖，没有 go.sum
      - name: Bank updater tests
        working-directory: Github学习/工具源码/题库更新
        run: go test ./...
